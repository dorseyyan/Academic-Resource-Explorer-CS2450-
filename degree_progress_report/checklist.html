<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Checklist</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="checklist">
    <div class="app">
      <header class="siteHeader">
        <div class="headerInner">
          <div class="brand" aria-label="Site">
            <strong>Degree Planner</strong>
            <span>Progress & checklist</span>
          </div>
          <nav class="topnav" aria-label="Primary">
            <a href="./index.html" data-nav="dashboard">Report</a>
            <a href="./checklist.html" data-nav="checklist">Checklist</a>
            <a href="./checklist.html" aria-disabled="true" title="Stub link">Profile</a>
          </nav>
        </div>
      </header>

      <main class="container content" data-page="checklist">
        <h1>Course Checklist</h1>

        <div class="twoCols">
          <div class="stack" aria-label="All checklists">
            <section class="card" aria-label="Major required checklist">
              <div class="cardTitle">
                <h2>Major Required</h2>
                <small>71 units</small>
              </div>
              <div class="checklist" id="majorRequiredList" aria-label="Major required list"></div>
            </section>

            <section class="card" aria-label="Major electives checklist">
              <div class="cardTitle">
                <h2>Major Electives</h2>
                <small>21 units</small>
              </div>
              <div class="meta" id="electiveRules" aria-label="Elective rules summary"></div>
              <div class="checklist" id="majorElectivesList" aria-label="Major electives list"></div>
            </section>

            <section class="card" aria-label="General Education checklist">
              <div class="cardTitle">
                <h2>General Education</h2>
                <small>43 units</small>
              </div>
              <div class="checklist" id="geChecklist" aria-label="General education requirements list"></div>
              <div class="meta" style="margin-top:10px;">
                <span>
                  Approved courses list: <a class="link" href="https://catalog.cpp.edu" target="_blank" rel="noreferrer">catalog.cpp.edu</a>
                </span>
              </div>
            </section>
          </div>

          <div class="stack">
            <section class="card" aria-label="Major progress summary">
              <div class="cardTitle">
                <h2>Major progress</h2>
                <small>Auto-updates</small>
              </div>

              <div class="progressRow" aria-label="Major requirements progress">
                <div class="bar" aria-hidden="true">
                  <span id="majorBarFill2"></span>
                </div>
                <div class="pct" id="majorPct2">0%</div>
              </div>
              <div class="meta" aria-label="Major progress details">
                <span id="majorCompleted2">—</span>
                <span id="majorUnitsLeft2">—</span>
              </div>
            </section>

            <section class="card" aria-label="GE progress summary">
              <div class="cardTitle">
                <h2>GE progress</h2>
                <small>Auto + manual</small>
              </div>
              <div class="progressRow" aria-label="GE requirements progress">
                <div class="bar" aria-hidden="true">
                  <span id="geBarFill2"></span>
                </div>
                <div class="pct" id="gePct2">0%</div>
              </div>
              <div class="meta" aria-label="GE progress details">
                <span id="geCompleted2">—</span>
                <span id="geUnitsLeft2">—</span>
              </div>
            </section>

            <div class="footerLink">
              <a class="link" href="./index.html">Back to report</a>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
